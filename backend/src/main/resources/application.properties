spring.application.name=backend
# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://ecommerce-app-db-server.mysql.database.azure.com:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=true
spring.datasource.username=ecommadmin
spring.datasource.password=07Sable02
spring.datasource.database=ecommerce_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
