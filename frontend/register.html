<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="css/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        .success-msg {
            color: #10b981;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        input.invalid {
            border-color: #ef4444;
        }

        input.valid {
            border-color: #10b981;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Crear Cuenta</h2>

        <form id="registerForm" class="space-y-4" novalidate>

            <!-- Tipo de Usuario (Simplificado para demo) -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Tipo de Usuario</label>
                <select id="userType"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="cliente">Cliente</option>
                    <option value="proveedor">Proveedor</option>
                </select>
            </div>

            <!-- Nombre -->
            <div>
                <label for="nombre" class="block text-gray-700 font-medium mb-1">Nombre Completo</label>
                <input type="text" id="nombre"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
                <p id="error-nombre" class="error-msg">El nombre es obligatorio.</p>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-gray-700 font-medium mb-1">Correo Electrónico</label>
                <input type="email" id="email"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
                <p id="error-email" class="error-msg">Ingresa un correo válido.</p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-gray-700 font-medium mb-1">Contraseña</label>
                <input type="password" id="password"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
                <div class="mt-1">
                    <div class="h-1 w-full bg-gray-200 rounded">
                        <div id="password-strength-bar" class="h-1 bg-red-500 rounded w-0 transition-all duration-300">
                        </div>
                    </div>
                </div>
                <p id="error-password" class="error-msg">Mínimo 8 caracteres, una mayúscula y un número.</p>
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirmPassword" class="block text-gray-700 font-medium mb-1">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
                <p id="error-confirmPassword" class="error-msg">Las contraseñas no coinciden.</p>
            </div>

            <!-- Fecha Nacimiento -->
            <div>
                <label for="fechaNacimiento" class="block text-gray-700 font-medium mb-1">Fecha de Nacimiento</label>
                <input type="date" id="fechaNacimiento"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
                <p id="error-fechaNacimiento" class="error-msg">Debes ser mayor de 18 años.</p>
            </div>

            <!-- Campos Extras (Dinámicos) -->
            <div id="extraFields"></div>

            <!-- Botón -->
            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                Registrarse
            </button>

            <p id="form-message" class="text-center mt-4 font-medium"></p>
        </form>

        <p class="text-center mt-4 text-gray-600 text-sm">
            ¿Ya tienes cuenta? <a href="login.html" class="text-blue-600 hover:underline">Inicia sesión</a>
        </p>
    </div>

    <script src="js/validation.js"></script>
</body>

</html>
