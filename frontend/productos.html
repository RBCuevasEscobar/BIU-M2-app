<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Gestión de Productos</title>
    <!-- Tailwind CSS -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="css/output.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-100 font-sans flex flex-col">

    <!-- Navigation Bar -->

    <nav id="mainNavProducts" class="bg-white shadow-md"></nav>

    <main class="container mx-auto px-6 py-8 flex-grow">

        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Inventario de Productos</h1>
            <button id="btnAgregar"
                class="hidden bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg shadow transition duration-300 flex items-center gap-2">
                <i class="fas fa-plus"></i> Nuevo Producto
            </button>
        </header>

        <!-- Filters -->
        <div class="bg-white p-4 rounded-lg shadow mb-6 flex gap-4 items-center">
            <label class="font-medium text-gray-600">Filtrar por tipo:</label>
            <select id="filtroTipo"
                class="border border-gray-300 rounded px-3 py-1 focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="todos">Todos</option>
                <option value="Fisico">Físico</option>
                <option value="Digital">Digital</option>
            </select>
        </div>

        <!-- Product List -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-600 uppercase text-sm leading-normal">
                    <tr>
                        <th class="py-3 px-6">ID</th>
                        <th class="py-3 px-6">Producto</th>
                        <th class="py-3 px-6">Precio</th>
                        <th class="py-3 px-6">Tipo</th>
                        <th class="py-3 px-6 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaProductos" class="text-gray-600 text-sm font-light">
                    <!-- Dynamic Content -->
                </tbody>
            </table>
            <!-- Empty State -->
            <div id="emptyState" class="hidden p-8 text-center text-gray-500">
                <i class="fas fa-box-open text-4xl mb-2"></i>
                <p>No hay productos registrados.</p>
            </div>
        </div>

        <!-- Modal Form -->
        <div id="modalProducto" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
            <div
                class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden transform transition-all scale-100">
                <div class="bg-gray-50 px-6 py-4 border-b flex justify-between items-center">
                    <h3 id="modalTitle" class="text-lg font-semibold text-gray-800">Nuevo Producto</h3>
                    <button id="btnCerrarModal" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <form id="formProducto" class="p-6 space-y-4">
                    <input type="hidden" id="productoId">

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Nombre</label>
                        <input type="text" id="nombre"
                            class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                            required>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Precio</label>
                        <input type="number" id="precio" step="0.01" min="0.01"
                            class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                            required>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Tipo de
                            Producto</label>
                        <select id="tipo"
                            class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Fisico">Físico</option>
                            <option value="Digital">Digital</option>
                        </select>
                    </div>

                    <!-- Campos Físicos -->
                    <div id="camposFisico" class="space-y-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Stock</label>
                            <input type="number" id="stock" min="0"
                                class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Peso (kg)</label>
                            <input type="number" id="peso" step="0.01" min="0"
                                class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <!-- Campos Digitales -->
                    <div id="camposDigital" class="hidden space-y-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">URL
                                Descarga</label>
                            <input type="url" id="urlDescarga"
                                class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Fecha Expiración
                                (Días)</label>
                            <input type="number" id="fechaExpiracion"
                                class="w-full border rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="Ej: 30">
                        </div>
                    </div>

                    <div class="pt-4 flex justify-end gap-3">
                        <button type="button" id="btnCancelar"
                            class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition">Cancelar</button>
                        <button type="submit"
                            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition shadow">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script type="module" src="js/productos.js"></script>
</body>

</html>
