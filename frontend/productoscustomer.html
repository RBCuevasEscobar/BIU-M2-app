<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Gestión de Productos para role CUSTOMER</title>
    <!-- Tailwind CSS -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="css/output.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-100 font-sans flex flex-col">

    <nav id="mainNav" class="bg-white shadow"></nav>

    <!-- Contenedor Principal Chatbot (Marco Gris Claro con Borde Gris Oscuro) -->
    <div id="chatbox"
        class="fixed top-8 right-4 w-[40ch] bg-gray-200 border-2 border-gray-500 rounded-xl shadow-lg cursor-move overflow-hidden">

        <!-- Frame Superior (Título Azul) -->
        <div id="chat-header" class="p-2 bg-blue-600 text-white font-bold text-center">
            Chat
        </div>

        <!-- Frame Inferior (Área de Diálogo Blanca) -->
        <div class="p-3">
            <div id="messages"
                class="h-64 overflow-y-auto bg-white border-2 border-black rounded-lg p-2 mb-2 flex flex-col">
                <!-- Aquí aparecerán los mensajes -->
                <span class="text-gray-400 italic">Bienvenido al chat...</span>
            </div>

            <!-- Input con Placeholder -->
            <input id="input"
                class="w-full border-2 border-gray-400 p-2 rounded-md focus:outline-none focus:border-blue-500"
                placeholder="Pregunta: " />
        </div>
    </div>

    <main class="w-full px-6 py-12">
        <div class="text-center mb-12">
            <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">Productos Destacados</h2>
            <p class="mt-4 text-xl text-gray-500">Explora nuestra colección de productos físicos y digitales.</p>
        </div>
        <!-- Productos cargados dinámicamente -->
        <div id="product-list-customer"
            class="grid gap-8 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 auto-rows-fr items-stretch">
        </div>
    </main>

    <script type="module" src="js/appcust.js"></script>
</body>

</html>
