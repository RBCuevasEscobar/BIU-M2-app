<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Gestión de Productos para role CUSTOMER</title>
    <!-- Tailwind CSS -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="css/output.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-100 font-sans flex flex-col">

    <nav id="mainNav" class="bg-white shadow"></nav>

    <!-- Contenedor Principal Chatbot (Marco Gris Claro con Borde Gris Oscuro) -->
    <!-- Agregamos 'z-[9999]' para que esté sobre todo -->
    <div id="chatbox"
        class="fixed top-20 right-4 min-w-[250px] max-w-[95vw] w-[40ch] bg-gray-200 border-2 border-gray-500 rounded-xl shadow-2xl flex flex-col overflow-hidden z-[999]">

        <div id="chat-header"
            class="p-2 bg-blue-600 text-white font-bold flex justify-between items-center cursor-move select-none">
            <span class="ml-2 text-sm md:text-base">Chat Agente IA</span>
            <button id="minimize-btn" class="hover:bg-blue-700 px-3 rounded font-bold transition-colors">+</button>
        </div>

        <div id="chat-content" class="p-3 flex flex-col flex-grow overflow-hidden hidden" style="height: 350px;">
            <div id="messages"
                class="flex-grow overflow-y-auto bg-white border-2 border-black rounded-lg p-2 mb-2 text-sm md:text-base">
                <span class="text-gray-400 italic">Chat activo...</span>
            </div>
            <input id="input" class="w-full border-2 border-gray-400 p-2 rounded-md text-sm" placeholder="Pregunta: " />
        </div>
    </div>

    <style>
        /* Responsividad: En pantallas pequeñas el chat se ajusta */
        @media (max-width: 640px) {
            #chatbox {
                width: 90% !important;
                right: 5% !important;
                left: 5% !important;
                max-height: 80vh;
            }
        }
    </style>

    <main class="w-full px-6 py-12">
        <div class="text-center mb-12">
            <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">Productos Destacados</h2>
            <p class="mt-4 text-xl text-gray-500">Explora nuestra colección de productos físicos y digitales.</p>
        </div>
        <!-- Productos cargados dinámicamente -->
        <div id="product-list-customer"
            class="grid gap-8 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 auto-rows-fr items-stretch">
        </div>
    </main>

    <script type="module" src="js/appcust.js"></script>
</body>

</html>
